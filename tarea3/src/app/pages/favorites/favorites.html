<h1>Mis favoritos</h1>

@if (favoritesService.favorites().length > 0) {
  <div class="grid">
    @for (movie of favoritesService.favorites(); track movie.id) {
      <div class="item">
        <app-movie-card [movie]="movie" />
        <button type="button" (click)="favoritesService.remove(movie.id)">
          Quitar de favoritos
        </button>
      </div>
    }
  </div>
} @else {
  <p>Aún no tienes películas favoritas.</p>
  <a routerLink="/">Explorar películas</a>
}
